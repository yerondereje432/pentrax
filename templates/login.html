<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · yerscan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b1118; --panel:#111b26; --line:rgba(162,186,204,.14); --text:#eef5f4; --muted:#8494a3; --cyan:#5de0df; --red:#f17a7e; --mono:"DM Mono",monospace; --sans:"Plus Jakarta Sans",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:13px var(--sans); }
    .login-card { width:min(390px, calc(100% - 32px)); padding:34px; border:1px solid var(--line); border-radius:10px; background:var(--panel); box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:34px; font-size:18px; font-weight:800; letter-spacing:-.06em; }
    .brand-mark { height:25px; width:25px; display:flex; align-items:flex-end; justify-content:center; gap:3px; padding:5px; border:1px solid var(--cyan); border-radius:7px; transform:rotate(-5deg); }
    .brand-mark i { width:3px; background:var(--cyan); border-radius:2px; }
    .brand-mark i:nth-child(1) { height:7px; opacity:.6; } .brand-mark i:nth-child(2) { height:12px; } .brand-mark i:nth-child(3) { height:9px; opacity:.75; }
    .eyebrow { color:var(--cyan); font:9px var(--mono); letter-spacing:.15em; }
    h1 { margin:10px 0 7px; font-size:25px; letter-spacing:-.06em; }
    p { margin:0 0 25px; color:var(--muted); font-size:11px; line-height:1.6; }
    label { display:grid; gap:7px; color:var(--muted); font:9px var(--mono); letter-spacing:.1em; }
    input { width:100%; height:40px; padding:0 11px; border:1px solid var(--line); border-radius:6px; outline:0; background:#162331; color:var(--text); font:13px var(--mono); }
    input:focus { border-color:rgba(93,224,223,.6); }
    button { width:100%; margin-top:17px; padding:11px; border:1px solid rgba(93,224,223,.33); border-radius:6px; background:var(--cyan); color:#061317; cursor:pointer; font-weight:700; }
    .error { margin:-5px 0 16px; padding:10px 11px; border:1px solid rgba(241,122,126,.28); border-radius:6px; background:rgba(241,122,126,.1); color:var(--red); font-size:10px; line-height:1.5; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><span>yerscan</span></div>
    <div class="eyebrow">SECURE DASHBOARD</div>
    <h1>Sign in.</h1>
    <p>Enter the shared workspace password to view vulnerability and network data.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="password">PASSWORD</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
