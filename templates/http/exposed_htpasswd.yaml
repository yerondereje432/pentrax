id: PENTRAX-HTTP-108
name: Exposed Apache Password File (.htpasswd)
severity: HIGH
category: DAST
http:
  method: GET
  paths:
    - /.htpasswd
    - /.htpasswd.bak
    - /admin/.htpasswd
  matchers:
    - type: status
      values: [200]
    - type: word
      words: ["$apr1$", "$2y$", "{SHA}"]
      condition: or
remediation: Move .htpasswd outside the web root, deny access to dotfiles in Apache/Nginx, and reset every password listed in the file.
sla: 48 Hours
