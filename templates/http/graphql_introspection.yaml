id: PENTRAX-API-GRAPHQL
name: Unrestricted GraphQL Schema Introspection
severity: MEDIUM
category: API
http:
  method: GET
  paths:
    - /graphql?query=%7B__schema%7Btypes%7Bname%7D%7D%7D
    - /api/graphql?query=%7B__schema%7Btypes%7Bname%7D%7D%7D
    - /v1/graphql?query=%7B__schema%7Btypes%7Bname%7D%7D%7D
  matchers:
    - type: status
      values: [200]
    - type: word
      words:
        - "__schema"
        - "types"
      condition: and
remediation: Disable GraphQL introspection in production environments to prevent complete schema and API discovery.
sla: 30 Days

